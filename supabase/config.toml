# Pawprint – Supabase local/branch configuration
project_id = "pawprint"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

# Runs on `supabase db reset` AND on every preview branch.
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[db.pooler]
default_pool_size = 15
max_client_conn = 200

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.analytics]
enabled = true
max_namespaces = 10

[storage.image_transformation]
enabled = true

[storage.vector]
enabled = false

[auth]
enabled = true
site_url = "https://pawprintskeeper.com"
additional_redirect_urls = ["https://pawprintskeeper.com", "http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.sms]
enable_confirmations = true

# ---- Edge Functions ----
[functions.vet-search]
verify_jwt = true     # logged-in users only

[functions.share-link]
verify_jwt = true     # logged-in users only

[functions.vaccine-reminders]
verify_jwt = false    # called by pg_cron; protected by x-cron-secret header instead
